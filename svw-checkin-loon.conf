# ================================================================
# 上汽大众超级App 自动签到 - Loon 配置片段
#
# 使用步骤：
#   1. 把 svw-capture.js 和 svw-checkin.js 上传到你的 GitHub Gist（私密）
#      或任意可直连的静态托管，获取 raw 链接，替换下方两处 <脚本URL>。
#   2. 将下方内容追加到你的 Loon 配置文件对应段落：
#      - [Script] 部分的两行加到配置文件 [Script] 段下
#      - [Mitm] 部分的 hostname 加上 mweb.mos.csvw.com
#   3. iOS 设置 → 通用 → 关于本机 → 证书信任设置，信任 Loon 证书
#      （你配置里已有 ca-p12 证书，若未安装请在 Loon 内重新生成并安装）。
#   4. 打开上汽大众 App → 进入「签到」页面 → 看到"凭据捕获成功"通知。
#   5. 完成。之后每天 08:30 由 cron 自动签到（Loon 需保持后台运行或次日主动打开一次）。
# ================================================================

[Script]
# 凭据捕获：打开 App 签到页时自动触发（配合 MITM 生效）
http-request ^https?:\/\/mweb\.mos\.csvw\.com\/mos\/operation\/home\/api\/v1\/user\/sign script-path=<脚本URL>/svw-capture.js, requires-body=false, tag=SVW签到-获取凭据, enable=true

# 每日自动签到（08:30），可自行修改时间
cron "30 8 * * *" script-path=<脚本URL>/svw-checkin.js, tag=SVW每日签到, enable=true

[Mitm]
# 在你现有配置的 hostname 后追加（原来是空的，直接写上即可）
hostname = mweb.mos.csvw.com
