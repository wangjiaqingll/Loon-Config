# ================================================================
# 小米 / 米家服务直连规则 - Loon 配置
#
# 用途：让 Home Assistant 的 xiaomi_home / xiaomi_miot 集成直连
#       米家云端 API 与 MIPS/MQTT 长连接，避免被 Fake-IP 劫持导致
#       mips_connect timed out、新设备（第二个温湿度计/空调/摄像头）
#       无法被发现、温度数据不同步到 HA / HomeKit。
#
# 关键点（务必两处都配，缺一不可）：
#   1. [General] real-ip  = 让这些域名返回真实 IP 而不是 Fake-IP。
#      MIPS/MQTT 是 TCP 长连接，拿到 198.18.x.x 假 IP 必然连不上。
#   2. [Rule]    DIRECT   = 让流量直连，不经过代理节点。
#
# 使用方式（二选一）：
#   A. 整份导入：把本文件作为一份完整 Loon 配置导入/订阅。
#      注意：若作为完整配置，需自行补全 [Proxy] 等其它段。
#   B. 片段合并（推荐，用于已有一份主配置的情况）：
#      - 把下面 [General] 里的 real-ip 那一行，加进你主配置的
#        [General] 段（没有就新建一个 [General] 段）。
#      - 把 [Rule] 段里的 DOMAIN-SUFFIX 规则，全部加到你主配置
#        [Rule] 段的最前面（必须在任何 PROXY / 兜底规则之前）。
#
# 修改后：重启 Loon（iPhone 与 Apple TV 都要更新配置/重新同步），
#         然后重载 HA 的 Xiaomi Home 集成。
# 验证：HA 日志不再刷 mips_connect timed out；
#       第二个温度计、空调、摄像头陆续出现在 HA 实体列表。
# ================================================================

[General]
# 让米家域名返回真实 IP，绕开 Fake-IP（解决 MIPS 长连接超时的关键）
real-ip = *.mi.com,*.xiaomi.com,*.miui.com,*.mijia.com,*.mi-img.com

[Rule]
# ---- 米家核心 API / MIPS-MQTT 长连接（xiaomi_home，必须直连）----
DOMAIN-SUFFIX,io.mi.com,DIRECT
DOMAIN-SUFFIX,mi.com,DIRECT
DOMAIN-SUFFIX,mijia.com,DIRECT
DOMAIN-SUFFIX,mi-img.com,DIRECT

# ---- 小米账号 / OAuth 认证 ----
DOMAIN-SUFFIX,xiaomi.com,DIRECT
DOMAIN-SUFFIX,miui.com,DIRECT

# ---- 米家摄像机 / 其他 IoT 接口（xiaomi_miot）----
DOMAIN-SUFFIX,mina.mi.com,DIRECT
DOMAIN-SUFFIX,i.mi.com,DIRECT
DOMAIN-SUFFIX,iot.mi.com,DIRECT
