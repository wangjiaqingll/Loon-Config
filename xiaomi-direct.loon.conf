# ================================================================
# 小米 / 米家服务直连规则 - Loon 配置片段
#
# 用途：让 Home Assistant 的 xiaomi_home / xiaomi_miot 集成直连
#       米家云端 API，避免被 Fake-IP 代理劫持导致连接超时、
#       温湿度等蓝牙设备数据无法同步到 HA / HomeKit。
#
# 使用步骤：
#   1. 将本文件内容整体复制，追加到你的 Loon 主配置 [Rule] 段的
#      **最前面**（必须放在任何 PROXY / 兜底规则之前才生效）。
#   2. 若你的 Loon 使用「订阅链接」方式管理规则，可把本文件放到
#      仓库后使用 raw 链接导入，或手动合并进主配置。
#   3. 修改后重启 Loon，并重启 HA（或重载 xiaomi_home 集成）。
#   4. 验证：HA 日志不再刷 mips_connect timed out，
#      温度计实体的最后更新时间持续刷新。
#
# 规则说明：DOMAIN-SUFFIX 会匹配该域名及其所有子域。
#           例如 io.mi.com 可覆盖 ha.api.io.mi.com、
#           cn.ha.api.io.mi.com、ha.mqtt.io.mi.com 等。
# ================================================================

# ---- 米家核心 API / MQTT（xiaomi_home 集成，必须直连）----
DOMAIN-SUFFIX,io.mi.com,DIRECT
DOMAIN-SUFFIX,mi.com,DIRECT
DOMAIN-SUFFIX,mijia.com,DIRECT
DOMAIN-SUFFIX,mi-img.com,DIRECT

# ---- 小米账号 / OAuth 认证 ----
DOMAIN-SUFFIX,xiaomi.com,DIRECT
DOMAIN-SUFFIX,miui.com,DIRECT

# ---- 米家智能摄像机 / 其他 IoT 接口（xiaomi_miot 集成）----
DOMAIN-SUFFIX,mina.mi.com,DIRECT
DOMAIN-SUFFIX,i.mi.com,DIRECT
DOMAIN-SUFFIX,iot.mi.com,DIRECT
